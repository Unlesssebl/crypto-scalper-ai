[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdata-terminal"
dynamic = ["version"]
description = "Live crypto market data in your terminal: Hyperliquid whales and liquidation heatmaps, liquidations across exchanges, order flow, funding, and an MCP server for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Brayden Siew" }]
keywords = [
    "crypto", "hyperliquid", "trading", "terminal", "tui", "liquidations",
    "orderflow", "cvd", "whale-tracker", "binance", "bybit", "okx", "deribit", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Terminals",
]

# These ranges MUST contain every pin in requirements.lock —
# tests/test_dependency_lock.py enforces it, and CI installs `pip install -e .`
# with dependencies (no --no-deps) so pip would refuse a contradiction.
# The lower bounds of rich and pandas are the lock pins: rich 14.3.3 and
# pandas 3.0.1 are the only versions ever tested (H1 had widened the ranges
# down to 13.7 / 2.2, which nothing exercises — S6).
dependencies = [
    "aiohttp>=3.12,<4.0",
    "rich>=14.3.3,<15",
    "pyfiglet>=1.0.2,<2.0",
    "pandas>=3.0.1,<4",
    "numpy>=1.26.0,<3.0",
    "TA-Lib>=0.6.5,<1",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
# `hyperdata mcp`: serve the live data to AI agents over the Model Context Protocol.
mcp = ["mcp>=2.2,<3"]
# `hyperdata-pulse`: durable market-pulse ingest/API in PostgreSQL.
pulse = ["asyncpg>=0.29,<1"]
desktop = [
    "winrt-windows-data-xml-dom>=3.2,<4 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2,<4 ; sys_platform == 'win32'",
    "winrt-windows-ui-notifications>=3.2,<4 ; sys_platform == 'win32'",
]

[dependency-groups]
# `uv run pytest` / `uv run ruff` work in any checkout without a manual install.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9"]

[project.urls]
Homepage = "https://hyperdata.vercel.app"
Source = "https://github.com/Co-Messi/HyperData-Terminal"
Issues = "https://github.com/Co-Messi/HyperData-Terminal/issues"

[project.scripts]
hyperdata = "hyperdata_terminal.cli:main"
hyperdata-screener = "apps.screener_web.__main__:main"
# Durable BTC/XRP market-pulse collector, ingest and read-only API.
hyperdata-pulse = "hyperdata_terminal.market_pulse.__main__:main"
# Regression/diagnostic tool: compare two JSONL screener recordings.
hyperdata-parity = "extensions.scalper.parity:main"
# Same command under the distribution name, so `uvx hyperdata-terminal` works.
hyperdata-terminal = "hyperdata_terminal.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hyperdata_terminal.__version__" }

[tool.setuptools.packages.find]
include = ["hyperdata_terminal*", "extensions.scalper*", "apps.screener_web*"]

[tool.setuptools.package-data]
"apps.screener_web" = ["dashboard.html"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Presentation layer: ASCII-art boot screens and Rich table markup read
# better unwrapped; everything else must respect the line limit.
"hyperdata_terminal/dashboards/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
